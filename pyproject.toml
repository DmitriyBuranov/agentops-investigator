[project]
name = "agentops-investigator"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Dmitriy Buranov", email = "dburanov.sup@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "google-genai>=2.22.0",
    "httpx>=0.28.1",
    "openai>=3.8.0",
    "python-dotenv>=1.2.3",
]

[project.scripts]
agentops-investigator = "agentops_investigator.cli:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.6",
]
